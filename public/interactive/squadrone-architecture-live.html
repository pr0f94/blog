<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squadrone · Live Architecture Reference</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e8edf3;
      --muted: #93a4b8;
      --panel: #111c2b;
      --panel-2: #172334;
      --panel-3: #1d2b3d;
      --canvas: #0b1420;
      --line: #2c3c50;
      --line-strong: #43546a;
      --orange: #ff9900;
      --orange-soft: #ffb84d;
      --cyan: #40b9d4;
      --purple: #b38bfa;
      --teal: #36c5b0;
      --green: #62c98d;
      --red: #ff6b73;
      --blue: #66a6ff;
      --shadow: 0 18px 50px rgba(0, 0, 0, .34);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--canvas);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      font-weight: 400;
    }

    button, input { font: inherit; }

    button { color: inherit; }

    .topbar {
      height: 72px;
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 460px) auto;
      align-items: center;
      gap: 22px;
      padding: 0 22px;
      background: #121b28;
      border-bottom: 1px solid #2e3a49;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .24);
      position: relative;
      z-index: 20;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      filter: drop-shadow(0 7px 10px rgba(0, 0, 0, .35));
    }

    .brand-copy { min-width: 0; }

    .brand-copy strong {
      display: block;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -.01em;
    }

    .brand-copy span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .concept-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-left: 10px;
      padding: 5px 8px;
      color: #ffd89a;
      background: rgba(255, 153, 0, .10);
      border: 1px solid rgba(255, 153, 0, .35);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .concept-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--orange);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(255, 153, 0, .15);
    }

    .search-wrap { position: relative; }

    .search-wrap svg {
      position: absolute;
      left: 13px;
      top: 50%;
      width: 17px;
      height: 17px;
      transform: translateY(-50%);
      color: #91a2b6;
      pointer-events: none;
    }

    .search-wrap input {
      width: 100%;
      height: 40px;
      padding: 0 42px 0 40px;
      color: #edf3f8;
      background: #0b1420;
      border: 1px solid #3b4b5e;
      border-radius: 5px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .search-wrap input:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255, 153, 0, .13);
    }

    .search-wrap kbd {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      padding: 2px 6px;
      color: #8798aa;
      background: #182536;
      border: 1px solid #34465a;
      border-bottom-color: #4a5a6c;
      border-radius: 3px;
      font-size: 11px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
    }

    .header-actions button,
    .icon-button {
      height: 36px;
      min-width: 36px;
      display: inline-grid;
      place-items: center;
      padding: 0 11px;
      color: #d7e0e9;
      background: #1a2839;
      border: 1px solid #34465a;
      border-radius: 4px;
      cursor: pointer;
    }

    .header-actions button:hover,
    .icon-button:hover { border-color: #6c7f94; background: #213247; }

    .shell {
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      background: var(--canvas);
    }

    .sidebar,
    .details {
      min-height: 0;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: #3a4a5d transparent;
      background: var(--panel);
    }

    .sidebar {
      padding: 18px 15px 24px;
      border-right: 1px solid #2c3a4b;
    }

    .details {
      padding: 18px;
      border-left: 1px solid #2c3a4b;
    }

    .section + .section {
      margin-top: 22px;
      padding-top: 19px;
      border-top: 1px solid #2a394b;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .section-heading h2 {
      margin: 0;
      color: #f1f5f9;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .section-heading span {
      color: #778ba1;
      font-size: 11px;
    }

    .flow-list,
    .layer-list { display: grid; gap: 6px; }

    .flow-button {
      width: 100%;
      min-height: 38px;
      display: grid;
      grid-template-columns: 8px 1fr auto;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      text-align: left;
      color: #c9d4df;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
    }

    .flow-button:hover { background: #172638; border-color: #31445a; }

    .flow-button.is-active {
      color: white;
      background: #202f40;
      border-color: #53677d;
      box-shadow: inset 3px 0 0 var(--orange);
    }

    .flow-button i {
      width: 7px;
      height: 7px;
      background: var(--flow-color, #8aa0b7);
      border-radius: 50%;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--flow-color, #8aa0b7) 20%, transparent);
    }

    .flow-button span { font-weight: 500; }

    .flow-button small {
      color: #8294a8;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .layer-toggle,
    .display-toggle {
      min-height: 34px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 7px;
      color: #c0ccd8;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
    }

    .layer-toggle:hover,
    .display-toggle:hover { background: #172638; }

    .layer-toggle input,
    .display-toggle input {
      width: 15px;
      height: 15px;
      accent-color: var(--orange);
    }

    .layer-toggle i {
      width: 9px;
      height: 9px;
      background: var(--layer-color);
      border-radius: 2px;
    }

    .legend { display: grid; gap: 9px; }

    .legend-row {
      display: grid;
      grid-template-columns: 28px 1fr;
      align-items: center;
      gap: 8px;
      color: #9fb0c2;
      font-size: 11px;
      line-height: 1.35;
    }

    .legend-line {
      height: 2px;
      background: var(--legend-color);
      position: relative;
    }

    .legend-line::after {
      content: "";
      position: absolute;
      top: -3px;
      right: -1px;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 6px solid var(--legend-color);
    }

    .legend-line.dashed {
      height: 0;
      background: none;
      border-top: 2px dashed var(--legend-color);
    }

    .prototype-note {
      margin-top: 21px;
      padding: 11px;
      color: #aebdca;
      background: #172434;
      border: 1px solid #314256;
      border-left: 3px solid var(--orange);
      border-radius: 4px;
      font-size: 11px;
      line-height: 1.5;
    }

    .stage {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 52px minmax(0, 1fr);
      background: #09121d;
    }

    .canvas-toolbar,
    .statusbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      color: #9eb0c2;
      background: #101a27;
      border-bottom: 1px solid #29384a;
    }

    .canvas-toolbar { justify-content: space-between; }

    .toolbar-group { display: flex; align-items: center; gap: 6px; }

    .live-overview { gap: 14px; min-width: 0; }

    .health-summary {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .health-stat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 0 9px;
      color: #aebdcb;
      background: #152235;
      border: 1px solid #2d4055;
      border-radius: 4px;
      font-size: 11px;
      white-space: nowrap;
    }

    .health-stat::before,
    .health-key::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      background: var(--status-color, #8294a8);
      border-radius: 50%;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--status-color, #8294a8) 16%, transparent);
    }

    .health-stat strong { color: #f2f6fa; font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .health-stat.healthy { --status-color: var(--green); }
    .health-stat.active { --status-color: var(--blue); }
    .health-stat.degraded { --status-color: var(--orange); }
    .health-stat.unavailable { --status-color: var(--red); }

    .simulated-time {
      color: #70869b;
      font-size: 11px;
      white-space: nowrap;
    }

    .canvas-toolbar .icon-button {
      height: 30px;
      min-width: 31px;
      padding: 0 8px;
      font-weight: 500;
    }

    .zoom-readout {
      min-width: 48px;
      color: #b9c6d2;
      font-size: 11px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .view-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #d3dde6;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .02em;
    }

    .view-label::before {
      content: "";
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(98, 201, 141, .13);
    }

    #viewport {
      min-height: 0;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 10% 12%, rgba(64, 185, 212, .05), transparent 24%),
        radial-gradient(circle at 84% 18%, rgba(255, 153, 0, .045), transparent 22%),
        #09121d;
      cursor: grab;
      touch-action: none;
    }

    #viewport.is-panning { cursor: grabbing; }

    #diagram {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
    }

    .live-popover {
      position: fixed;
      z-index: 80;
      width: min(390px, calc(100vw - 32px));
      padding: 0;
      color: #e9eff5;
      background: rgba(17, 28, 43, .98);
      border: 1px solid #53677e;
      border-top: 3px solid var(--popover-color, var(--green));
      border-radius: 7px;
      box-shadow: 0 20px 55px rgba(0, 0, 0, .48);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .1s ease, transform .1s ease;
    }

    .live-popover.is-visible { opacity: 1; transform: translateY(0); }

    .popover-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 15px 11px;
      border-bottom: 1px solid #2b3c50;
    }

    .popover-eyebrow {
      margin-bottom: 4px;
      color: #8398ac;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .popover-title { margin: 0; color: #fff; font-size: 16px; font-weight: 500; line-height: 1.25; }

    .popover-health {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--popover-color, var(--green));
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .popover-health::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--popover-color, var(--green));
      border-radius: 50%;
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--popover-color, var(--green)) 16%, transparent);
    }

    .popover-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 11px 15px;
      background: #132033;
      border-bottom: 1px solid #2b3c50;
    }

    .popover-metric span { display: block; color: #71879c; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .07em; }
    .popover-metric strong { display: block; margin-top: 4px; color: #dce5ed; font-size: 13px; font-weight: 500; line-height: 1.35; }

    .workloads { padding: 12px 15px 14px; }
    .workloads-heading { margin-bottom: 8px; color: #8ca0b3; font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
    .workload + .workload { margin-top: 11px; padding-top: 11px; border-top: 1px solid #293a4e; }
    .workload-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .workload-plugin { min-width: 0; overflow: hidden; color: #f2f6fa; font-size: 13px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
    .workload-progress { color: #9eb0c1; font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .workload-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 5px; color: #8095a9; font-size: 11px; }
    .progress-track { height: 4px; margin-top: 7px; overflow: hidden; background: #25364a; border-radius: 999px; }
    .progress-track i { display: block; height: 100%; width: var(--progress); background: var(--blue); border-radius: inherit; }
    .empty-workload { padding: 2px 0; color: #8396a9; font-size: 11px; line-height: 1.5; }
    .simulation-note { padding: 9px 15px; color: #8e826d; background: rgba(255, 153, 0, .06); border-top: 1px solid rgba(255, 153, 0, .16); font-size: 11px; line-height: 1.4; }

    .statusbar {
      justify-content: space-between;
      border-top: 1px solid #29384a;
      border-bottom: 0;
      font-size: 11px;
    }

    .statusbar strong { color: #e4ebf2; }

    .statusbar .hint { color: #71859a; }

    /* SVG architecture */
    .grid-line { stroke: #162438; stroke-width: 1; }

    .boundary {
      fill: rgba(13, 24, 37, .84);
      stroke: #516277;
      stroke-width: 2;
      rx: 12;
    }

    .boundary.host { fill: rgba(13, 25, 39, .92); stroke: #687b90; }
    .boundary.external { fill: rgba(17, 32, 43, .68); stroke: #3f8063; stroke-dasharray: 8 6; }
    .boundary.sandbox { fill: rgba(51, 27, 22, .55); stroke: #c16b43; stroke-dasharray: 9 6; }

    .zone rect {
      fill: rgba(22, 35, 52, .58);
      stroke: #33485e;
      stroke-width: 1.4;
      rx: 8;
    }

    .zone[data-layer="interface"] rect { stroke: #417c95; }
    .zone[data-layer="control"] rect { stroke: #98681c; }
    .zone[data-layer="execution"] rect { stroke: #735ab1; }
    .zone[data-layer="data"] rect { stroke: #2f8278; }

    .boundary-title {
      fill: #e8eef5;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: .01em;
    }

    .boundary-meta {
      fill: #7890a7;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .zone-title {
      fill: #91a5b8;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .zone-note { fill: #71879c; font-size: 11px; }

    .architecture-title {
      fill: #f2f6fa;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -.02em;
    }

    .architecture-subtitle { fill: #879caf; font-size: 13px; }

    .truth-banner rect {
      fill: rgba(17, 66, 67, .42);
      stroke: #388d82;
      stroke-width: 1.2;
      rx: 5;
    }

    .truth-banner text { fill: #9ee5d8; font-size: 11px; font-weight: 500; }

    .service {
      cursor: pointer;
      outline: none;
      transition: opacity .16s, filter .16s;
    }

    .service .card {
      fill: #152235;
      stroke: #4a5c70;
      stroke-width: 1.5;
      rx: 7;
      filter: none;
      transition: stroke .16s, stroke-width .16s, fill .16s;
    }

    .service:hover .card,
    .service:focus-visible .card { stroke: #a9bbcd; stroke-width: 2; fill: #1b2b40; }

    .service.is-selected .card {
      stroke: var(--orange);
      stroke-width: 2.6;
      fill: #202e3f;
      filter: url(#selected-glow);
    }

    .service.is-flow-node .card { stroke: var(--flow-accent, #8fb4ff); stroke-width: 2.2; }

    .service.is-live-node .card,
    .service.is-live-node .engine-card { stroke: var(--blue); stroke-width: 2.2; }

    .service[data-health="degraded"] .card { stroke: var(--orange); }
    .service[data-health="unavailable"] .card { stroke: var(--red); }

    .live-health-ring { fill: color-mix(in srgb, var(--node-health, #8294a8) 20%, #101b2a); stroke: var(--node-health, #8294a8); stroke-width: 1; }
    .live-health-dot { fill: var(--node-health, #8294a8); }
    .live-count-ring { fill: #185a95; stroke: #82baff; stroke-width: 1; }
    .live-count-ring.is-waiting { fill: #4b2d72; stroke: #c2a4ff; }
    .live-count-text { fill: #fff; font-size: 11px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }

    .service.is-dimmed { opacity: .18; filter: saturate(.5); }
    .service.is-hidden, .zone.is-hidden, .edge-group.is-hidden { display: none; }

    .icon-tile { rx: 5; }
    .icon-text { fill: white; font-size: 12px; font-weight: 500; text-anchor: middle; }
    .node-title { fill: #f0f4f8; font-size: 14px; font-weight: 500; }
    .node-subtitle { fill: #91a4b6; font-size: 11px; font-weight: 400; }
    .node-badge-bg { fill: #22354a; stroke: #435971; stroke-width: .8; rx: 3; }
    .node-badge-text { fill: #b5c7d7; font-size: 11px; font-weight: 500; letter-spacing: .01em; text-anchor: middle; }

    .broker-shell {
      fill: rgba(40, 29, 57, .66);
      stroke: #70589a;
      stroke-width: 1.5;
      rx: 8;
    }

    .broker-title { fill: #e5daf8; font-size: 14px; font-weight: 500; }
    .broker-note { fill: #ad9ec4; font-size: 11px; }

    .queue-node .card { fill: #332646; stroke: #8667b1; }
    .queue-node .node-title { font-size: 11px; }
    .queue-node.dlq .card { fill: #42232d; stroke: #b75866; }
    .queue-node.dlq .node-title { fill: #ffc2c7; }

    .engine-card { fill: #222c3b; stroke: #657890; stroke-width: 1.4; stroke-dasharray: 7 5; rx: 6; }
    .engine-title { fill: #e0e8f0; font-size: 14px; font-weight: 500; }
    .engine-copy { fill: #91a4b6; font-size: 11px; font-weight: 400; }

    .edge {
      fill: none;
      stroke-width: 2.6;
      stroke-opacity: .13;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: none !important;
      transition: stroke-opacity .16s, stroke-width .16s, filter .16s;
    }

    marker path {
      fill-opacity: .34;
      stroke-width: .65;
      stroke-opacity: 1;
      paint-order: stroke fill;
    }

    #arrow-neutral path { stroke: #8c9caf; }
    #arrow-cyan path { stroke: #40b9d4; }
    #arrow-orange path { stroke: #ff9900; }
    #arrow-purple path { stroke: #b38bfa; }
    #arrow-teal path { stroke: #36c5b0; }
    #arrow-green path { stroke: #62c98d; }
    #arrow-red path { stroke: #ff6b73; }

    .edge.request { stroke: var(--cyan); marker-end: url(#arrow-cyan); }
    .edge.control { stroke: var(--orange); marker-end: url(#arrow-orange); }
    .edge.queue { stroke: var(--purple); marker-end: url(#arrow-purple); }
    .edge.data { stroke: var(--teal); marker-end: url(#arrow-teal); }
    .edge.external { stroke: var(--green); marker-end: url(#arrow-green); }
    .edge.privileged { stroke: var(--red); marker-end: url(#arrow-red); stroke-dasharray: none; }
    .edge.dependency { stroke: #8c9caf; marker-end: none; stroke-dasharray: none; stroke-opacity: .20; stroke-width: 1.6; }
    .edge.recovery { stroke: var(--red); marker-end: url(#arrow-red); stroke-dasharray: none; }

    .edge-wire {
      fill: none;
      stroke-width: 4;
      stroke-opacity: 0;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
      transition: stroke-opacity .14s ease;
    }

    .edge-wire.request { stroke: var(--cyan); }
    .edge-wire.control { stroke: var(--orange); }
    .edge-wire.queue { stroke: var(--purple); }
    .edge-wire.data { stroke: var(--teal); }
    .edge-wire.external { stroke: var(--green); }
    .edge-wire.privileged,
    .edge-wire.recovery { stroke: var(--red); }

    .edge-group[data-link-health="healthy"] .edge,
    .edge-group[data-link-health="healthy"] .edge-wire { stroke: var(--green); }
    .edge-group[data-link-health="unhealthy"] .edge,
    .edge-group[data-link-health="unhealthy"] .edge-wire { stroke: var(--red); }
    .edge-group[data-link-health="unknown"] .edge,
    .edge-group[data-link-health="unknown"] .edge-wire { stroke: #8294a8; }

    .edge-group.is-dimmed { opacity: .08; }
    .edge-group.is-related .edge,
    .edge-group.is-active .edge {
      stroke-width: 2.6;
    }

    .edge-group.is-related .edge {
      stroke-opacity: .84;
      filter: url(#edge-glow);
    }

    .edge-group.is-active .edge { stroke-opacity: .52; filter: none; }
    .edge-group.is-active .edge.dependency { stroke-width: 1.6; stroke-opacity: .20; }

    .edge-group.is-active .edge-wire,
    .edge-group.is-related .edge-wire { stroke-opacity: 1; }

    .edge-label {
      fill: #aebdcc;
      stroke: #09121d;
      stroke-width: 5px;
      paint-order: stroke;
      stroke-linejoin: round;
      font-size: 11px;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: opacity .12s ease;
    }

    .edge-group.is-related .edge-label { opacity: 1; }

    body.hide-labels .edge-label { display: none; }
    body.is-navigating .edge,
    body.is-navigating .edge-wire,
    body.is-navigating .live-health-ring {
      filter: none !important;
      transition: none !important;
    }

    body.is-navigating .edge-wire { display: none; }

    body.is-navigating .service,
    body.is-navigating .service .card,
    body.is-navigating .service .engine-card {
      transition: none !important;
      filter: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }

    @media (max-width: 1100px) {
      .health-stat span { display: none; }
      .live-overview { gap: 8px; }
      .topbar { grid-template-columns: minmax(330px, 1fr) minmax(240px, 360px) auto; }
    }

    @media (max-width: 600px) {
      .stage { grid-template-rows: 80px minmax(0, 1fr); }
      .canvas-toolbar {
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        gap: 6px;
        padding: 6px 8px;
      }
      .live-overview {
        width: 100%;
        justify-content: center;
        gap: 6px;
      }
      .view-label {
        width: 9px;
        overflow: hidden;
        gap: 0;
        color: transparent;
        font-size: 0;
      }
      .health-summary { gap: 4px; }
      .health-stat {
        min-height: 26px;
        gap: 4px;
        padding: 0 6px;
      }
      .simulated-updated { display: none; }
      .canvas-toolbar > .toolbar-group:last-child {
        width: 100%;
        justify-content: center;
      }
      .canvas-toolbar .icon-button { height: 28px; }
    }

    /* Detail panel */
    .details-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid #2b3b4d;
    }

    .details-eyebrow {
      color: var(--orange-soft);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .details h2 {
      margin: 5px 0 0;
      color: white;
      font-size: 19px;
      font-weight: 500;
      line-height: 1.2;
    }

    .details .close-detail {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      color: #9fb0c1;
      background: transparent;
      border: 1px solid #34475b;
      border-radius: 4px;
      cursor: pointer;
    }

    .details .close-detail:hover { color: white; border-color: #72869b; }

    .detail-summary {
      margin: 14px 0 0;
      color: #bdc9d4;
      line-height: 1.55;
    }

    .detail-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 13px;
    }

    .detail-chip {
      padding: 4px 7px;
      color: #b7c9d9;
      background: #1c2b3c;
      border: 1px solid #374b60;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 500;
    }

    .detail-grid {
      display: grid;
      gap: 0;
      margin-top: 18px;
      border-top: 1px solid #2b3b4d;
    }

    .detail-row {
      display: grid;
      gap: 5px;
      padding: 12px 0;
      border-bottom: 1px solid #2b3b4d;
    }

    .detail-row dt {
      color: #7f94a9;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .detail-row dd {
      margin: 0;
      color: #d1dae3;
      font-size: 12px;
      line-height: 1.5;
    }

    .empty-detail {
      padding: 20px 4px;
      color: #90a2b4;
      line-height: 1.55;
    }

    .empty-detail strong { display: block; margin-bottom: 6px; color: #d9e1e8; }

    .principles {
      display: grid;
      gap: 8px;
      margin-top: 18px;
    }

    .principle {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 8px;
      align-items: start;
      padding: 9px;
      background: #172536;
      border: 1px solid #2e4256;
      border-radius: 4px;
      font-size: 11px;
    }

    .principle b {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      color: #ffcf83;
      background: rgba(255, 153, 0, .12);
      border-radius: 3px;
    }

    .principle span { color: #a9b8c7; line-height: 1.4; }

    @media (max-width: 1250px) {
      .topbar { grid-template-columns: minmax(300px, 1fr) minmax(250px, 390px) auto; }
    }
  </style>
</head>

        deepDive: { slug: "business-directory-plugin", stage: "Privilege reduction deep dive", batch: "review-29a1", progress: 31, elapsed: "03:18", flow: "candidate" },
        report: { slug: "wp-members", stage: "Evidence report build", batch: "report-16d9", progress: 92, elapsed: "00:48", flow: "report" },
        scanQueued: { slug: "essential-addons-for-elementor-lite", stage: "Waiting for scan worker", batch: "batch-71c4", progress: null, elapsed: "queued 01:12", flow: "scan" },
        reviewQueued: { slug: "metform", stage: "Waiting for candidate worker", batch: "review-f44e", progress: null, elapsed: "queued 00:37", flow: "candidate" }
      };

      const defaultLiveState = {
        health: "healthy",
        status: "Healthy",
        metricLabel: "Health probe",
        metric: "Passing",
        heartbeat: "Current snapshot",
        work: []
      };

      const liveState = {
        browser: { metricLabel: "Client state", metric: "Session connected", heartbeat: "Current snapshot" },
        cli: { health: "na", status: "On demand", metricLabel: "Client state", metric: "No resident process", heartbeat: "Not applicable", empty: "Client process; no persistent runtime health." },
        frontend: { metricLabel: "HTTP", metric: "Responding", heartbeat: "Recent" },
        api: { metricLabel: "API", metric: "Serving status and commands", heartbeat: "Recent", empty: "No plugin work resides in the API." },
        scheduler: { metricLabel: "Dispatcher", metric: "Waiting work ready · leases current", heartbeat: "Recent", badgeKind: "waiting", work: [jobs.scanQueued, jobs.reviewQueued] },
        rabbitmq: { metricLabel: "Broker diagnostics", metric: "Ready messages observed", heartbeat: "Recent", empty: "Transport diagnostics only; waiting plugin work resides on the scheduler." },
        "queue-scan": { metricLabel: "Queue diagnostics", metric: "Ready message observed", heartbeat: "Recent", empty: "Transport diagnostics only; this node does not duplicate plugin residency." },
        "queue-candidate": { metricLabel: "Queue diagnostics", metric: "Ready message observed", heartbeat: "Recent", empty: "Transport diagnostics only; this node does not duplicate plugin residency." },
        "queue-sandbox": { metricLabel: "Queue diagnostics", metric: "Empty", heartbeat: "Recent", empty: "No verification message is waiting." },
        "queue-report": { metricLabel: "Queue diagnostics", metric: "Empty", heartbeat: "Recent", empty: "No report message is waiting." },
        "queue-submission": { metricLabel: "Queue diagnostics", metric: "Empty", heartbeat: "Recent", empty: "No approved submission message is waiting." },
        "queue-deadletter": { metricLabel: "Queue diagnostics", metric: "Empty", heartbeat: "Recent", empty: "No dead-lettered messages." },
        "scan-worker": { metricLabel: "Workload", metric: "Scan work active", heartbeat: "Recent", work: [jobs.scan] },
        "candidate-worker": { metricLabel: "Workload", metric: "Refinement active", heartbeat: "Recent", work: [jobs.deepDive] },
        "sandbox-worker": { health: "na", status: "Inactive · optional profile", metricLabel: "Profile", metric: "Not enabled", heartbeat: "Not running", empty: "No sandbox worker or isolated verification attempt is active." },
        "report-worker": { metricLabel: "Workload", metric: "Deterministic report build active", heartbeat: "Recent", work: [jobs.report] },
        "submission-worker": { metricLabel: "Workload", metric: "Idle · awaiting approval", heartbeat: "Recent", empty: "No plugin is currently being submitted." },
        engine: { health: "na", status: "Package dependency", metricLabel: "Consumers", metric: "Scan · candidate · sandbox", heartbeat: "Not applicable", empty: "Build dependency, not a separately running service." },
        postgres: { metricLabel: "Database", metric: "Authoritative state available", heartbeat: "Recent", empty: "Workflow state is available; plugin residency is shown only at the current scheduler or worker." },
        artifacts: { metricLabel: "Storage", metric: "Artifact volume available", heartbeat: "Recent", empty: "Evidence storage is available; plugin residency is not duplicated here." },
        settings: { health: "na", status: "Static configuration", metricLabel: "Configuration", metric: "Mounted read-only", heartbeat: "Not applicable", empty: "Static configuration has no runtime health probe." },
        catalogue: { status: "Reachable", metricLabel: "Latest refresh", metric: "Succeeded", heartbeat: "Recent", empty: "Public source and eligibility inputs are available." },
        llm: { health: "healthy", status: "Healthy", metricLabel: "Latest model call", metric: "Response confirmed", heartbeat: "Recent", empty: "Provider health is inferred from the latest completed model response; plugin residency remains on the workers." },
        patchstack: { health: "na", status: "Inactive", metricLabel: "Submission destination", metric: "Contacted only after approval", heartbeat: "Not contacted", empty: "No approved submission is active." },
        ingress: { health: "na", status: "Inactive", metricLabel: "Attempt sandbox", metric: "No active attempt", heartbeat: "Not running", empty: "Created only while isolated verification work exists." },
        wordpress: { health: "na", status: "Inactive", metricLabel: "Attempt sandbox", metric: "No active target", heartbeat: "Not running", empty: "Created only while isolated verification work exists." },
        mariadb: { health: "na", status: "Inactive", metricLabel: "Attempt sandbox", metric: "No active test state", heartbeat: "Not running", empty: "Created only while isolated verification work exists." }
      };

      const healthPalette = {
        healthy: { color: "#62c98d", label: "Healthy" },
        degraded: { color: "#ffb84d", label: "Degraded" },
        unavailable: { color: "#ff6b73", label: "Unavailable" },
        na: { color: "#8294a8", label: "Not monitored" }
      };

      const svg = document.getElementById("diagram");
      const viewport = document.getElementById("viewport");
      const popover = document.getElementById("live-popover");
      const svgDefs = svg.querySelector("defs");
      const serviceNodes = [...svg.querySelectorAll(".service[data-node]")];
      const edgeGroups = [...svg.querySelectorAll(".edge-group")];
      const baseView = { x: 0, y: 60, width: 1800, height: 1060 };
      const svgNS = "http://www.w3.org/2000/svg";
      let view = { ...baseView };
      let hoveredNode = null;
      let pinnedNode = null;
      let panStart = null;
      let wheelFrame = null;
      let wheelFactor = 1;
      let wheelPoint = null;
      let panFrame = null;
      let pendingPan = null;
      let navigationEndTimer = null;

      const stateFor = id => ({ ...defaultLiveState, ...(liveState[id] || {}) });
      const escapeHTML = value => String(value).replace(/[&<>"]/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" })[character]);

      const activeEdges = new Set([
        "api-scheduler", "scheduler-qscan", "scheduler-qcandidate",
        "qscan-scan", "qcandidate-candidate", "qreport-report",
        "scan-engine", "catalogue-api", "catalogue-scan", "llm-scan", "scan-postgres", "scan-artifacts",
        "candidate-engine", "llm-candidate", "candidate-postgres", "candidate-artifacts",
        "report-postgres", "report-artifacts"
      ]);

      edgeGroups.forEach((group, index) => {
        const endpointHealth = [stateFor(group.dataset.from).health, stateFor(group.dataset.to).health];
        group.dataset.linkHealth = endpointHealth.some(value => value === "degraded" || value === "unavailable")
          ? "unhealthy"
          : endpointHealth.some(value => value === "na") ? "unknown" : "healthy";
        const edge = group.querySelector("path.edge");
        if (!edge || edge.classList.contains("dependency")) return;
        const classes = [...edge.classList].filter(className => className !== "edge");

        const mask = document.createElementNS(svgNS, "mask");
        const maskId = `wire-outline-${index}`;
        mask.setAttribute("id", maskId);
        mask.setAttribute("maskUnits", "userSpaceOnUse");
        mask.setAttribute("maskContentUnits", "userSpaceOnUse");
        mask.setAttribute("x", "-120");
        mask.setAttribute("y", "-120");
        mask.setAttribute("width", "2040");
        mask.setAttribute("height", "1360");

        const outerMask = edge.cloneNode(false);
        outerMask.removeAttribute("class");
        outerMask.removeAttribute("marker-end");
        outerMask.setAttribute("fill", "none");
        outerMask.setAttribute("stroke", "white");
        outerMask.setAttribute("stroke-width", "4");
        outerMask.setAttribute("stroke-linecap", "round");
        outerMask.setAttribute("stroke-linejoin", "round");
        const innerMask = edge.cloneNode(false);
        innerMask.removeAttribute("class");
        innerMask.removeAttribute("marker-end");
        innerMask.setAttribute("fill", "none");
        innerMask.setAttribute("stroke", "black");
        innerMask.setAttribute("stroke-width", "3");
        innerMask.setAttribute("stroke-linecap", "round");
        innerMask.setAttribute("stroke-linejoin", "round");
        mask.append(outerMask, innerMask);
        svgDefs.append(mask);

        const wire = edge.cloneNode(false);
        wire.setAttribute("class", [...classes, "edge-wire"].join(" "));
        wire.setAttribute("mask", `url(#${maskId})`);
        wire.setAttribute("aria-hidden", "true");
        group.insertBefore(wire, edge);
      });

      function addHealthMarker(node) {
        const id = node.dataset.node;
        const state = stateFor(id);
        const palette = healthPalette[state.health] || healthPalette.na;
        const card = node.querySelector(".card, .engine-card");
        if (!card) return;
        const width = Number(card.getAttribute("width")) || card.getBBox().width;
        const marker = document.createElementNS(svgNS, "g");
        marker.classList.add("live-node-marker");
        marker.setAttribute("aria-hidden", "true");

        const ring = document.createElementNS(svgNS, "circle");
        ring.classList.add("live-health-ring");
        ring.setAttribute("cx", width - 11);
        ring.setAttribute("cy", 11);
        ring.setAttribute("r", 7);
        const dot = document.createElementNS(svgNS, "circle");
        dot.classList.add("live-health-dot");
        dot.setAttribute("cx", width - 11);
        dot.setAttribute("cy", 11);
        dot.setAttribute("r", 3.4);
        marker.append(ring, dot);

        if (state.work.length) {
          const badgeKind = state.badgeKind || (state.work.every(item => item.progress === null) ? "waiting" : "active");
          const countRing = document.createElementNS(svgNS, "circle");
          countRing.classList.add("live-count-ring", `is-${badgeKind}`);
          countRing.setAttribute("cx", width - 33);
          countRing.setAttribute("cy", 11);
          countRing.setAttribute("r", 8.5);
          const countText = document.createElementNS(svgNS, "text");
          countText.classList.add("live-count-text");
          countText.setAttribute("x", width - 33);
          countText.setAttribute("y", 11.5);
          countText.textContent = state.work.length > 9 ? "9+" : state.work.length;
          marker.append(countRing, countText);
        }

        node.style.setProperty("--node-health", palette.color);
        node.dataset.health = state.health;
        node.classList.toggle("is-live-node", state.work.length > 0);
        node.dataset.workState = state.badgeKind || (state.work.length ? "active" : "idle");
        node.dataset.workSlugs = state.work.map(item => item.slug).join(" ");
        node.setAttribute("aria-label", `${components[id].name}, ${state.status}, ${state.work.length} ${node.dataset.workState} plugin items`);
        node.append(marker);
      }

      function updateSummary() {
        const states = Object.keys(components).map(stateFor);
        const activePlugins = new Set(states.flatMap(state => state.work).filter(item => item.progress !== null).map(item => item.slug));
        const waitingPlugins = new Set(states.flatMap(state => state.work).filter(item => item.progress === null).map(item => item.slug));
        document.getElementById("healthy-count").textContent = states.filter(state => state.health === "healthy").length;
        document.getElementById("active-count").textContent = activePlugins.size;
        document.getElementById("waiting-count").textContent = waitingPlugins.size;
        document.getElementById("degraded-count").textContent = states.filter(state => state.health === "degraded").length;
        document.getElementById("unavailable-count").textContent = states.filter(state => state.health === "unavailable").length;
      }

      function applyVisualState() {
        serviceNodes.forEach(node => {
          const id = node.dataset.node;
          node.classList.toggle("is-selected", id === pinnedNode);
        });

        edgeGroups.forEach(group => {
          const active = activeEdges.has(group.dataset.edge);
          const related = hoveredNode && (group.dataset.from === hoveredNode || group.dataset.to === hoveredNode);
          group.classList.toggle("is-active", active);
          group.classList.toggle("is-related", Boolean(related));
          group.classList.toggle("is-dimmed", Boolean(hoveredNode && !related));
        });
      }

      function renderWorkload(item) {
        const progress = item.progress === null ? "Waiting" : `${item.progress}%`;
        const bar = item.progress === null ? "" : `<div class="progress-track"><i style="--progress:${item.progress}%"></i></div>`;
        return `<div class="workload" title="${escapeHTML(item.slug)}">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
            <strong style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHTML(item.slug)}</strong>
            <span class="workload-progress">${progress}</span>
          </div>
          <div class="workload-meta"><span>${escapeHTML(item.stage)}</span><span>${escapeHTML(item.elapsed)}</span></div>
          <div class="workload-meta"><span>${escapeHTML(item.batch)}</span><span>${escapeHTML(item.flow)}</span></div>
          ${bar}
        </div>`;
      }

      function positionPopover(clientX, clientY) {
        const margin = 12;
        const offset = 16;
        const box = popover.getBoundingClientRect();
        let left = clientX + offset;
        let top = clientY + offset;
        if (left + box.width > window.innerWidth - margin) left = clientX - box.width - offset;
        if (top + box.height > window.innerHeight - margin) top = window.innerHeight - box.height - margin;
        popover.style.left = `${Math.max(margin, left)}px`;
        popover.style.top = `${Math.max(margin, top)}px`;
      }

      function anchorForNode(id) {
        const node = svg.querySelector(`.service[data-node="${id}"]`);
        const box = node?.getBoundingClientRect();
        return box ? { clientX: box.right, clientY: box.top + Math.min(28, box.height / 2) } : { clientX: window.innerWidth / 2, clientY: 100 };
      }

      function showPopover(id, point = null) {
        const component = components[id];
        if (!component || panStart) return;
        const state = stateFor(id);
        const palette = healthPalette[state.health] || healthPalette.na;
        const status = state.status || palette.label;
        const work = state.work || [];
        const workMarkup = work.length
          ? `${work.slice(0, 4).map(renderWorkload).join("")}${work.length > 4 ? `<div class="empty-workload">+ ${work.length - 4} more plugin items</div>` : ""}`
          : `<div class="empty-workload">${escapeHTML(state.empty || "No plugin is currently executing in this component.")}</div>`;
        popover.style.setProperty("--popover-color", palette.color);
        popover.innerHTML = `<div class="popover-header">
            <div><div class="popover-eyebrow">${escapeHTML(component.layer)}</div><h2 class="popover-title">${escapeHTML(component.name)}</h2></div>
            <span class="popover-health">${escapeHTML(status)}</span>
          </div>
          <div class="popover-metrics">
            <div class="popover-metric"><span>${escapeHTML(state.metricLabel)}</span><strong>${escapeHTML(state.metric)}</strong></div>
            <div class="popover-metric"><span>Last heartbeat</span><strong>${escapeHTML(state.heartbeat)}</strong></div>
          </div>
          <div class="workloads"><div class="workloads-heading">Plugin work at this component · ${work.length}</div>${workMarkup}</div>
          <div class="simulation-note">Prototype telemetry · simulated and not connected to the current Squadrone runtime</div>`;
        popover.classList.add("is-visible");
        hoveredNode = id;
        applyVisualState();
        const target = point || anchorForNode(id);
        requestAnimationFrame(() => positionPopover(target.clientX, target.clientY));
      }

      function hidePopover({ force = false } = {}) {
        if (pinnedNode && !force) {
          showPopover(pinnedNode);
          return;
        }
        popover.classList.remove("is-visible");
        hoveredNode = null;
        applyVisualState();
      }

      function clearPinned() {
        pinnedNode = null;
        hidePopover({ force: true });
      }

      function markNavigating() {
        document.body.classList.add("is-navigating");
        clearTimeout(navigationEndTimer);
        navigationEndTimer = setTimeout(() => document.body.classList.remove("is-navigating"), 140);
      }

      function setView(next) {
        const minWidth = 420;
        const maxWidth = 2300;
        const width = Math.max(minWidth, Math.min(maxWidth, next.width));
        const height = width * (baseView.height / baseView.width);
        view = { x: next.x, y: next.y, width, height };
        svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.width} ${view.height}`);
        document.getElementById("zoom-readout").textContent = `${Math.round((baseView.width / view.width) * 100)}%`;
      }

      function fitView() { setView({ ...baseView }); }

      function zoom(factor, clientX = null, clientY = null) {
        const rect = viewport.getBoundingClientRect();
        if (clientX === null) clientX = rect.left + rect.width / 2;
        if (clientY === null) clientY = rect.top + rect.height / 2;
        const px = (clientX - rect.left) / rect.width;
        const py = (clientY - rect.top) / rect.height;
        const targetWidth = view.width * factor;
        const targetHeight = targetWidth * (baseView.height / baseView.width);
        const anchorX = view.x + view.width * px;
        const anchorY = view.y + view.height * py;
        setView({ x: anchorX - targetWidth * px, y: anchorY - targetHeight * py, width: targetWidth, height: targetHeight });
      }

      function resetAll() {
        clearPinned();
        fitView();
      }

      serviceNodes.forEach(node => {
        const id = node.dataset.node;
        addHealthMarker(node);
        node.addEventListener("mouseenter", event => showPopover(id, event));
        node.addEventListener("mousemove", event => { if (!panStart) positionPopover(event.clientX, event.clientY); });
        node.addEventListener("mouseleave", () => hidePopover());
        node.addEventListener("focus", () => showPopover(id));
        node.addEventListener("blur", () => hidePopover());
        node.addEventListener("click", event => {
          event.stopPropagation();
          pinnedNode = pinnedNode === id ? null : id;
          showPopover(id, event);
          applyVisualState();
        });
        node.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            pinnedNode = pinnedNode === id ? null : id;
            showPopover(id);
          }
        });
      });

      document.getElementById("reset-view").addEventListener("click", resetAll);
      document.getElementById("fit-view").addEventListener("click", fitView);
      document.getElementById("zoom-in").addEventListener("click", () => zoom(.82));
      document.getElementById("zoom-out").addEventListener("click", () => zoom(1.22));

      let modalFocusTrap = false;
      const focusableElements = () => Array.from(document.querySelectorAll(
        'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
      )).filter(element => {
        const style = getComputedStyle(element);
        return style.display !== "none" && style.visibility !== "hidden";
      });

      window.addEventListener("message", event => {
        if (event.source !== window.parent) return;

        if (event.data?.type === "squadrone-architecture-modal-state") {
          modalFocusTrap = Boolean(event.data.expanded);
        }

        if (event.data?.type === "squadrone-architecture-focus-target") {
          const focusable = focusableElements();
          const target = event.data.edge === "first" ? focusable[0] : focusable.at(-1);
          target?.focus();
        }
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          clearPinned();
          window.parent.postMessage({ type: "squadrone-architecture-escape" }, "*");
        }

        if (modalFocusTrap && event.key === "Tab") {
          const focusable = focusableElements();
          const first = focusable[0];
          const last = focusable.at(-1);
          const leavingBackward = event.shiftKey && document.activeElement === first;
          const leavingForward = !event.shiftKey && document.activeElement === last;

          if (leavingBackward || leavingForward) {
            event.preventDefault();
            window.parent.postMessage({
              type: "squadrone-architecture-focus-edge",
              direction: leavingBackward ? "backward" : "forward",
            }, "*");
          }
        }
      });

      svg.addEventListener("wheel", event => {
        event.preventDefault();
        markNavigating();
        const boundedDelta = Math.max(-120, Math.min(120, event.deltaY));
        wheelFactor *= Math.exp(boundedDelta * .0015);
        wheelFactor = Math.max(.72, Math.min(1.38, wheelFactor));
        wheelPoint = { clientX: event.clientX, clientY: event.clientY };
        if (wheelFrame) return;
        wheelFrame = requestAnimationFrame(() => {
          zoom(wheelFactor, wheelPoint.clientX, wheelPoint.clientY);
          wheelFactor = 1;
          wheelPoint = null;
          wheelFrame = null;
        });
      }, { passive: false });

      viewport.addEventListener("pointerdown", event => {
        if (event.target.closest?.(".service")) return;
        clearPinned();
        panStart = { clientX: event.clientX, clientY: event.clientY, x: view.x, y: view.y };
        markNavigating();
        viewport.setPointerCapture(event.pointerId);
        viewport.classList.add("is-panning");
      });
      viewport.addEventListener("pointermove", event => {
        if (!panStart) return;
        markNavigating();
        const dx = (event.clientX - panStart.clientX) * (view.width / viewport.clientWidth);
        const dy = (event.clientY - panStart.clientY) * (view.height / viewport.clientHeight);
        pendingPan = { x: panStart.x - dx, y: panStart.y - dy, width: view.width, height: view.height };
        if (panFrame) return;
        panFrame = requestAnimationFrame(() => {
          setView(pendingPan);
          pendingPan = null;
          panFrame = null;
        });
      });
      const endPan = () => { panStart = null; viewport.classList.remove("is-panning"); markNavigating(); };
      viewport.addEventListener("pointerup", endPan);
      viewport.addEventListener("pointercancel", endPan);
      viewport.addEventListener("dblclick", event => {
        if (!event.target.closest?.(".service")) zoom(.72, event.clientX, event.clientY);
      });

      updateSummary();
      fitView();
      applyVisualState();
    })();
  </script>
</body>
</html>
